name: Fetch market data

on:
  schedule:
    # Back to once daily as of 2026-08-16 -- was briefly switched to
    # every 2 hours, which contributed to hitting Supabase's free-tier
    # Egress cap (115% of 5GB in one billing cycle). See run_pipeline.py
    # and the site's caching fixes from the same incident.
    #
    # 07:35 UTC is deliberately NOT the desired landing time -- it's
    # backed off from it to compensate for a confirmed, structural
    # ~3h25m scheduling delay on this repo's GitHub Actions scheduler
    # (confirmed live 2026-08-14 through 2026-08-16: three different
    # cron values -- 13:00 UTC, 11:00 UTC, 11:17 UTC -- all produced
    # the same ~3h23-26m delay regardless of value or whether they
    # landed on the hour, ruling out both a top-of-hour GitHub-load
    # theory and a stale-cron-cache theory. workflow_dispatch (manual)
    # fired instantly and correctly every time throughout, confirming
    # the workflow itself is fine -- only the schedule trigger is
    # affected, specific to this account/repo).
    #
    # 07:35 UTC + ~3h25m delay lands the ACTUAL run around 11:00 UTC,
    # which is ~7am Eastern during EDT (UTC-4, in effect now, August).
    # GitHub Actions cron is always UTC and does NOT shift for daylight
    # saving -- once EDT ends and EST (UTC-5) begins around November,
    # this same 07:35 UTC will land around 6am Eastern instead, an hour
    # earlier, not a new delay. If a real fix ever replaces this
    # (an external trigger hitting workflow_dispatch on a real
    # schedule, instead of depending on GitHub's own scheduler), this
    # whole compensation goes away and the cron can just be set to the
    # real desired UTC-equivalent of 7am Eastern directly.
    - cron: "35 7 * * *"
  workflow_dispatch: {}  # lets you trigger it manually from the GitHub UI

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r predictwatch/pipeline/requirements.txt

      - name: Run pipeline
        run: python run_pipeline.py
        working-directory: predictwatch/pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
