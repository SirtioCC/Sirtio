name: Fetch market data

on:
  schedule:
    # Hourly as of 2026-08-29. Previously daily (and briefly every 2
    # hours, which contributed to hitting Supabase's free-tier Egress
    # cap at 115% of 5GB in one billing cycle -- see the incident notes
    # in run_pipeline.py/sirtio_score.py and the site's caching fixes
    # from the same incident). Going hourly is safe now that
    # sirtio_score.py's population-stats reads are incremental
    # (wallet_score_stats cache, see run_pipeline.py's SCHEMA) instead
    # of re-aggregating the entire 90-day ledger from scratch on every
    # run -- the thing that made run frequency the direct multiplier on
    # egress before.
    #
    # ":07" rather than the top of the hour, per GitHub's own guidance
    # to avoid the exact-hour pileup of everyone else's cron jobs. Note
    # a confirmed, structural ~3h25m scheduling delay was previously
    # observed on this repo's GitHub Actions scheduler (2026-08-14
    # through 2026-08-16, manual workflow_dispatch unaffected) -- with a
    # single daily landing time that needed compensating for; at hourly
    # cadence there's no single target time to hit, so a fixed lag just
    # shifts every run's actual timestamp by the same amount without
    # affecting how often the pipeline actually runs.
    - cron: "7 * * * *"
  workflow_dispatch: {}  # lets you trigger it manually from the GitHub UI

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r predictwatch/pipeline/requirements.txt

      - name: Run pipeline
        run: python run_pipeline.py
        working-directory: predictwatch/pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
